apply plugin: 'com.android.application'
android {
    compileSdk 36
    defaultConfig {
        applicationId "com.sd.sddigiclock"
        minSdkVersion 23
        targetSdk 36
        vectorDrawables.useSupportLibrary = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
    productFlavors {
    }
    buildFeatures {
        buildConfig = true
    }
    // Configure only for each module that uses Java 8
    // language features (either in its source code or
    // through dependencies).
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.sd.sddigiclock'
}




dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-ui:2.9.1'
    implementation 'androidx.fragment:fragment:1.8.8'
    implementation 'androidx.navigation:navigation-fragment:2.9.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.4'

    def billing_version = '8.0.0'
    implementation "com.android.billingclient:billing:$billing_version"
    implementation 'com.google.android.gms:play-services-base:18.7.0'

    def lifecycle_version = '2.9.1'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    def work_version = '2.10.2'
    implementation "androidx.work:work-runtime:$work_version"

    def ads_version = '24.4.0'
    implementation "com.google.android.gms:play-services-ads:$ads_version"

    def core_version = '1.16.0'
    implementation "androidx.core:core:$core_version"

    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    implementation 'com.google.guava:guava:33.4.8-android'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }


}